[project]
name = "sol-pump-sniper"
version = "0.1.0"
description = "Solana Pump.fun sniper bot — Jupiter execution, DexScreener monitoring, Telegram control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "solders>=0.21.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "base58>=2.1.1",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "telegramify-markdown>=1.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"
